<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <!-- 밝은 청록에서 짙은 파랑으로 -->
    <linearGradient id="tank" x1="0.3" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#45c3f5"/>
      <stop offset="40%"  stop-color="#1896e0"/>
      <stop offset="100%" stop-color="#0a56ab"/>
    </linearGradient>
    <radialGradient id="sun" cx="68%" cy="8%" r="60%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0fdff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f0fdff" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="far"><feGaussianBlur stdDeviation="0.7"/></filter>
    <filter id="glow" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 작은 은빛 물고기 타일 (360 x 320, 세로로 이어 붙여 무한 반복) -->
    <g id="fishTile">
      <text x="40"  y="20">0</text>  <text x="95"  y="45">o</text>  <text x="160" y="15">0</text>
      <text x="232" y="38">()</text> <text x="300" y="22">o</text>  <text x="330" y="70">0</text>
      <text x="62"  y="92">o</text>  <text x="128" y="112">0</text> <text x="205" y="85">o</text>
      <text x="270" y="122">0</text> <text x="44"  y="150">()</text> <text x="110" y="172">o</text>
      <text x="182" y="150">0</text> <text x="250" y="182">o</text> <text x="320" y="160">0</text>
      <text x="78"  y="232">0</text> <text x="150" y="252">o</text> <text x="215" y="226">()</text>
      <text x="290" y="262">0</text> <text x="340" y="300">o</text> <text x="52"  y="292">o</text>
      <text x="122" y="306">0</text> <text x="262" y="310">o</text> <text x="190" y="290">0</text>
    </g>
  </defs>

  <style>
    text { font-family: "Courier New", Consolas, Menlo, monospace; white-space: pre; }

    /* 화면 전체가 아주 천천히 다가오는 카메라 느낌 */
    .cam { transform-origin: 180px 320px; animation: cam 10s ease-in-out infinite; }
    @keyframes cam {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04) translateY(-4px); }
    }

    /* 물고기 레이어 (시차) */
    .near { fill: #e2f4ff; font-size: 11px; opacity: .8;  animation: up 16s linear infinite; }
    .mid  { fill: #c4e6ff; font-size: 8px;  opacity: .55; animation: up 24s linear infinite; }
    .farf { fill: #a9dbff; font-size: 6px;  opacity: .35; animation: up 36s linear infinite; }
    @keyframes up { from { transform: translateY(0); } to { transform: translateY(-320px); } }

    /* 고래상어: 천천히 아래로 미끄러지며 살짝 흔들림 */
    .whale { transform-origin: 180px 320px; animation: drift 8s ease-in-out infinite; }
    @keyframes drift {
      0%, 100% { transform: translate(-3px, -6px) rotate(-1.5deg); }
      50%      { transform: translate(4px, 8px)   rotate(1.5deg); }
    }
    .shark { fill: #eef9ff; font-size: 13px; font-weight: bold; }

    /* 빛줄기 */
    .rays { transform-origin: 250px -80px; animation: rays 12s ease-in-out infinite; }
    @keyframes rays {
      0%, 100% { transform: rotate(-3deg); opacity: .7; }
      50%      { transform: rotate(3deg);  opacity: 1; }
    }

    /* 관람객 실루엣이 미세하게 움직임 */
    .crowd { animation: crowd 5s ease-in-out infinite; }
    @keyframes crowd { 0%,100% { transform: translateX(0); } 50% { transform: translateX(2px); } }
    .screen { fill: #bfe8ff; animation: screen 2.5s ease-in-out infinite; }
    @keyframes screen { 0%,100% { opacity: .35; } 50% { opacity: .8; } }

    .title { font-family: "Quicksand", "Comfortaa", "Century Gothic", "Segoe UI", "Helvetica Neue", sans-serif;
             font-weight: 300; fill: #fff24f; font-size: 38px; letter-spacing: 1px; }
    .sub   { font-family: "Quicksand", "Comfortaa", "Century Gothic", "Segoe UI", "Helvetica Neue", sans-serif;
             font-weight: 300; fill: #ffffff; font-size: 14px; letter-spacing: .5px; }
  </style>

  <clipPath id="frame"><rect width="640" height="360" rx="14"/></clipPath>

  <g clip-path="url(#frame)">
   <!-- 세로 장면을 반시계 방향으로 90° 돌려 가로로: 관람객은 아래, 고래상어는 오른쪽으로 헤엄 -->
   <g transform="translate(0 360) rotate(-90)">
    <g class="cam">
      <rect x="-20" y="-20" width="400" height="680" fill="url(#tank)"/>
      <rect x="-20" y="-20" width="400" height="680" fill="url(#sun)"/>

      <!-- 빛줄기 -->
      <g class="rays" filter="url(#blur3)">
        <polygon points="200,-20 225,-20 160,660 100,660" fill="url(#ray)"/>
        <polygon points="250,-20 268,-20 250,660 205,660" fill="url(#ray)"/>
        <polygon points="300,-20 330,-20 360,660 300,660" fill="url(#ray)"/>
      </g>

      <!-- 멀리 있는 물고기 -->
      <g class="farf" filter="url(#far)">
        <use xlink:href="#fishTile" href="#fishTile" x="14" y="0"/>
        <use xlink:href="#fishTile" href="#fishTile" x="14" y="320"/>
        <use xlink:href="#fishTile" href="#fishTile" x="14" y="640"/>
      </g>
      <g class="mid">
        <use xlink:href="#fishTile" href="#fishTile" x="-28" y="150"/>
        <use xlink:href="#fishTile" href="#fishTile" x="-28" y="470"/>
        <use xlink:href="#fishTile" href="#fishTile" x="-28" y="-170"/>
      </g>

      <!-- 고래상어 (머리는 아래, 꼬리는 오른쪽 위) -->
      <g class="whale">
        <g transform="translate(102 96) rotate(12 78 208)">
          <!-- 짙은 몸 그림자 -->
          <ellipse cx="78" cy="262" rx="58" ry="170" fill="#0b3463" opacity="0.55" filter="url(#blur8)"/>

          <g class="shark" filter="url(#glow)">
            <!-- 꼬리지느러미 -->
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="3s" repeatCount="indefinite"
                                values="-8 76 100; 9 76 100; -8 76 100" keyTimes="0;0.5;1"
                                calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
              <text xml:space="preserve">
                <tspan x="0" dy="0">              /|</tspan>
                <tspan x="0" dy="16">             / /</tspan>
                <tspan x="0" dy="16">            / /</tspan>
                <tspan x="0" dy="16">    \      / /</tspan>
                <tspan x="0" dy="16">     \.   / /</tspan>
                <tspan x="0" dy="16">       \ / /</tspan>
                <tspan x="0" dy="16">        \ /</tspan>
              </text>
            </g>
            <!-- 몸통과 머리 -->
            <text xml:space="preserve">
              <tspan x="0" dy="112">         |:|</tspan>
              <tspan x="0" dy="16">        |.:.|</tspan>
              <tspan x="0" dy="16">        |:.:|</tspan>
              <tspan x="0" dy="16">       |.:o:.|</tspan>
              <tspan x="0" dy="16">       |:.:.:|</tspan>
              <tspan x="0" dy="16">      |.o.:.o.|</tspan>
              <tspan x="0" dy="16">      |:.:o:.:|</tspan>
              <tspan x="0" dy="16">     |.o.:.:.o.|</tspan>
              <tspan x="0" dy="16">     |:.o.:.o.:|</tspan>
              <tspan x="0" dy="16">    |.o.:.o.:.o.|</tspan>
              <tspan x="0" dy="16">    |:.o.:.:.o.:|</tspan>
              <tspan x="0" dy="16">    |.o.:.o.:.o.|</tspan>
              <tspan x="0" dy="16">  \ |:.o.:.:.o.:| /</tspan>
              <tspan x="0" dy="16">   \|.o.:.o.:.o.|/</tspan>
              <tspan x="0" dy="16">    |:.o.:.:.o.:|</tspan>
              <tspan x="0" dy="16">    |.o.:.o.:.o.|</tspan>
              <tspan x="0" dy="16">   @|:.o.:.:.o.:|@</tspan>
              <tspan x="0" dy="16">    \ o . : . o /</tspan>
              <tspan x="0" dy="16">     '-._____.-'</tspan>
            </text>
          </g>
        </g>
      </g>

      <!-- 가까운 물고기 -->
      <g class="near">
        <use xlink:href="#fishTile" href="#fishTile" x="0" y="60"/>
        <use xlink:href="#fishTile" href="#fishTile" x="0" y="380"/>
        <use xlink:href="#fishTile" href="#fishTile" x="0" y="700"/>
      </g>

      <!-- 왼쪽 가장자리: 수조를 바라보는 관람객 실루엣 -->
      <g class="crowd" fill="#020d1f">
        <rect x="-20" y="-20" width="28" height="680"/>
        <circle cx="10" cy="20"  r="14"/> <circle cx="22" cy="48"  r="12"/>
        <circle cx="8"  cy="80"  r="15"/> <circle cx="20" cy="108" r="11"/>
        <circle cx="6"  cy="140" r="13"/> <circle cx="24" cy="166" r="12"/>
        <circle cx="12" cy="196" r="14"/> <circle cx="28" cy="222" r="10"/>
        <circle cx="8"  cy="252" r="15"/> <circle cx="20" cy="284" r="12"/>
        <circle cx="10" cy="312" r="13"/> <circle cx="26" cy="340" r="11"/>
        <circle cx="6"  cy="372" r="14"/> <circle cx="20" cy="402" r="12"/>
        <circle cx="10" cy="432" r="15"/> <circle cx="24" cy="462" r="11"/>
        <circle cx="8"  cy="492" r="13"/> <circle cx="20" cy="522" r="12"/>
        <circle cx="12" cy="552" r="14"/> <circle cx="26" cy="580" r="10"/>
        <circle cx="8"  cy="610" r="15"/> <circle cx="20" cy="636" r="12"/>
        <!-- 들고 있는 휴대폰 -->
        <rect x="34" y="122" width="9" height="15" rx="2" transform="rotate(-20 38 129)"/>
        <rect x="38" y="356" width="9" height="15" rx="2" transform="rotate(15 42 363)"/>
        <rect x="32" y="508" width="9" height="15" rx="2" transform="rotate(-10 36 515)"/>
      </g>
      <g class="crowd">
        <rect class="screen" x="35.5" y="124" width="6" height="11" rx="1" transform="rotate(-20 38 129)"/>
        <rect class="screen" x="39.5" y="358" width="6" height="11" rx="1" transform="rotate(15 42 363)"/>
        <rect class="screen" x="33.5" y="510" width="6" height="11" rx="1" transform="rotate(-10 36 515)"/>
      </g>
    </g>
   </g>
  </g>
</svg>
